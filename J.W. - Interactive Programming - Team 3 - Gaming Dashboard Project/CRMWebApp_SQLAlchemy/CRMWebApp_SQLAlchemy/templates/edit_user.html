<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edit User</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="{{ url_for('static', filename='styles.css') }}">
</head>
<body class="container mt-4">

    <h2>Edit User</h2>

    <form method="POST">
        <div class="mb-3">
            <label>First Name</label>
            <input type="text" name="first_name" class="form-control" value="{{ user.first_name }}" required>
        </div>
        <div class="mb-3">
            <label>Last Name</label>
            <input type="text" name="last_name" class="form-control" value="{{ user.last_name }}" required>
        </div>
        <div class="mb-3">
            <label>Address Line 1</label>
            <input type="text" name="address_line1" class="form-control" value="{{ user.address_line1 }}" required>
        </div>
        <div class="mb-3">
            <label>Address Line 2 (Optional)</label>
            <input type="text" name="address_line2" class="form-control" value="{{ user.address_line2 }}">
        </div>
        <div class="mb-3">
            <label>City</label>
            <input type="text" name="city" class="form-control" value="{{ user.city }}" required>
        </div>
        <div class="mb-3">
            <label>State</label>
            <input type="text" name="state" class="form-control" value="{{ user.state }}" required>
        </div>
        <div class="mb-3">
            <label>Zipcode</label>
            <input type="text" name="zipcode" class="form-control" value="{{ user.zipcode }}" required>
        </div>
        <div class="mb-3">
            <label>Mobile</label>
            <input type="text" name="mobile" class="form-control" value="{{ user.mobile }}" required>
        </div>
        <div class="mb-3">
            <label>Email</label>
            <input type="email" name="email" class="form-control" value="{{ user.email }}" required>
        </div>
        <button type="submit" class="btn btn-success">Update User</button>
        <a href="{{ url_for('index') }}" class="btn btn-secondary">Cancel</a>
    </form>

</body>
</html>
