<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edit Tournament</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="{{ url_for('static', filename='styles.css') }}">
</head>
<body class="container mt-4">

    <h2>Edit Tournament</h2>

    <form method="POST">
        <div class="mb-3">
            <label>Name</label>
            <input type="text" name="first_name" class="form-control" value="{{ tournament.name }}" required>
        </div>
        <div class="mb-3">
            <label>Last Name</label>
            <input type="text" name="last_name" class="form-control" value="{{ tournament.location }}" required>
        </div>
        <div class="mb-3">
            <label>Address Line 1</label>
            <input type="text" name="address_line1" class="form-control" value="{{ tournament.date }}" required>
        </div>
        <button type="submit" class="btn btn-success">Update Customer</button>
        <a href="{{ url_for('index') }}" class="btn btn-secondary">Cancel</a>
    </form>

</body>
</html>
