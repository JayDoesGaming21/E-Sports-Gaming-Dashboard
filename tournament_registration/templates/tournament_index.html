<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Tournament Management</title>
        <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
        <link rel="stylesheet" href="{{ url_for('static', filename='styles.css') }}">
    </head>
    
<body class="container mt-4">
    <h2>Tournament List</h2>
    <a href="{{ url_for('add_tournament') }}" class="btn btn-primary mb-3">Add New Tournament</a>
    
    <table class="table table-bordered">
        <thead>
            <tr>
                <th>Name</th>
                <th>Location</th>
                <th>Date</th>
                <th>Actions</th>
            </tr>
        </thead>
        <tbody>
            {% for tournament in tournaments %}
            <tr>
                <td>{{ tournament.name }}</td>
                <td>{{ tournament.location }}</td>
                <td>{{ tournament.date }}</td>
                <td>
                    <a href="{{ url_for('edit_tournament', id=tournament.id) }}" class="btn btn-warning btn-sm">Edit</a>
                    <a href="{{ url_for('delete_tournament', id=tournament.id) }}" class="btn btn-danger btn-sm"
                       onclick="return confirm('Are you sure you want to delete this tournament?');">Delete</a>
                </td>
            </tr>
            {% endfor %}
        </tbody>
    </table>
</body>
</html>
